# Cada push a main: el bot verifica los niveles y, si todo pasa, publica el sitio en GitHub Pages.
#
# El sitio armado (landing en la raíz, juego en juego/) se sube a la rama gh-pages, que es la
# fuente de GitHub Pages en este repositorio. No hace falta cambiar nada en Settings.

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    name: Bot verifica que los niveles se pueden completar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --stack-size=30000 tests/verificar-niveles.js

  desplegar:
    name: Publicar landing page + juego en la rama gh-pages
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio (landing en la raíz, juego en juego/)
        run: |
          mkdir _site
          cp index.html _site/
          cp -r juego _site/juego
          touch _site/.nojekyll
      - name: Subir el sitio a gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
