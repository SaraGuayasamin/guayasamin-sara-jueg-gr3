# Cada push a main: el bot verifica los niveles y, si todo pasa, publica el sitio en GitHub Pages.
#
# Configuración (una sola vez):
#   GitHub > Settings > Pages > Build and deployment > Source: "GitHub Actions"

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    name: Bot verifica que los niveles se pueden completar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --stack-size=30000 tests/verificar-niveles.js

  desplegar:
    name: Publicar landing page + juego en GitHub Pages
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio (landing en la raíz, juego en juego/)
        run: |
          mkdir _site
          cp index.html _site/
          cp -r juego _site/juego
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
